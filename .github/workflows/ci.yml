name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: ./backend
        run: ruff check .

      - name: Run pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          JWT_SECRET_KEY: test_secret_key_for_ci_only
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: test
          MINIO_BUCKET: test-bucket
          ADMIN_EMAIL: admin@test.example
          ADMIN_PASSWORD: testpass
          ADMIN_DISPLAY_NAME: Test Admin
        run: pytest

  # 프론트엔드 검사(2026-10-17) — lint(ESLint 9 flat config)·타입체크·vitest. 그 전에는 CI 어디에서도 돌지 않았다
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck (tsc)
        working-directory: ./frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (vitest)
        working-directory: ./frontend
        run: npx vitest run --reporter=dot
