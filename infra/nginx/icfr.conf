# 호스트 nginx 설정(컨테이너 아님).
# 설치: sudo cp infra/nginx/icfr.conf /etc/nginx/sites-available/icfr.conf
#       sudo ln -sf /etc/nginx/sites-available/icfr.conf /etc/nginx/sites-enabled/icfr.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 서버에서 직접 고치지 말 것 — 이 파일이 원본이다.

# 로그인 시도 제한 (2026-09-30, 사외 접속 허용에 앞서) — 같은 IP 에서 분당 10회, 순간 5회까지 허용.
# 넘으면 429(프론트가 "로그인 시도가 너무 많습니다"로 안내). 비밀번호 대입 공격을 늦춘다.
limit_req_zone $binary_remote_addr zone=icfr_login:10m rate=10r/m;

server {
    listen 80;
    server_name icfr.synap.co.kr;

    # Let's Encrypt 갱신용(webroot). ACG 상 80은 0.0.0.0/0 개방.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name icfr.synap.co.kr;

    ssl_certificate     /etc/letsencrypt/live/icfr.synap.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icfr.synap.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 보안 1단계(2026-10-01, 사외 허용 후): 다른 사이트로 주소 전체를 넘기지 않고, 쓰지 않는 기기 권한은 막는다.
    # nginx 버전도 숨긴다(스캐너가 버전별 취약점을 고르는 단서).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # 증빙 업로드 대비. 백엔드 제한은 MAX_UPLOAD_BYTES=52428800(50MiB)이며
    # multipart 오버헤드만큼 여유를 둬 실제 거절은 백엔드가 하도록 한다.
    client_max_body_size 51m;

    access_log /var/log/nginx/icfr.access.log;
    error_log  /var/log/nginx/icfr.error.log;

    # API → backend 컨테이너(127.0.0.1:8000)
    location = /api/auth/login {
        limit_req zone=icfr_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # 대용량 업로드 스트리밍
    }

    # 그 외 → frontend 컨테이너(nginx:alpine, 127.0.0.1:8080 → 컨테이너 80)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
