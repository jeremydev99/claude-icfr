# 호스트 nginx 설정(컨테이너 아님).
# 설치: sudo cp infra/nginx/icfr.conf /etc/nginx/sites-available/icfr.conf
#       sudo ln -sf /etc/nginx/sites-available/icfr.conf /etc/nginx/sites-enabled/icfr.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 서버에서 직접 고치지 말 것 — 이 파일이 원본이다.

server {
    listen 80;
    listen [::]:80;
    server_name icfr.synap.co.kr;

    # Let's Encrypt 갱신용(webroot). ACG 상 80은 0.0.0.0/0 개방.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name icfr.synap.co.kr;

    ssl_certificate     /etc/letsencrypt/live/icfr.synap.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icfr.synap.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 증빙 업로드 대비. 백엔드 제한은 MAX_UPLOAD_BYTES=52428800(50MiB)이며
    # multipart 오버헤드만큼 여유를 둬 실제 거절은 백엔드가 하도록 한다.
    client_max_body_size 51m;

    access_log /var/log/nginx/icfr.access.log;
    error_log  /var/log/nginx/icfr.error.log;

    # API → backend 컨테이너(127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;   # 대용량 업로드 스트리밍
    }

    # 그 외 → frontend 컨테이너(nginx:alpine, 127.0.0.1:8080 → 컨테이너 80)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
